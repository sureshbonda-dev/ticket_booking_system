spring.application.name=auth-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinema_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Create/update tables for local development. Use versioned migrations before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Local development key only. Override JWT_SECRET with a private 32+ byte value outside local development.
app.jwt.secret=${JWT_SECRET:cinema-local-development-secret-change-this-32-bytes-minimum}
app.jwt.issuer=cinema-auth-service
app.jwt.access-token-ttl=PT1H
