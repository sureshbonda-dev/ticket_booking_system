spring.application.name=booking-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinema_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

app.jwt.secret=${JWT_SECRET:cinema-local-development-secret-change-this-32-bytes-minimum}
app.jwt.issuer=cinema-auth-service
booking.seat-lock-duration=PT10M
booking.cancellation-cutoff=PT2H
payment.provider=mock
catalog-service.base-url=http://catalog-service
