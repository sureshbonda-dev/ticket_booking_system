spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://catalog-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/catalog/**

spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.server.webmvc.routes[3].id=seat-inventory
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://booking-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/seats/**

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:cinema-local-development-secret-change-this-32-bytes-minimum}
app.jwt.issuer=cinema-auth-service
